version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks:
        # Domain values are passed by value on purpose (immutability, no
        # aliasing); the copies are small compared to SQLite or IPC costs.
        - hugeParam
        - rangeValCopy
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers and the Things simulator build SQL and commands from
      # fixed test data.
      - path: _test\.go
        linters: [gosec, noctx, errcheck, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TitouanSC/Things3-MCP
